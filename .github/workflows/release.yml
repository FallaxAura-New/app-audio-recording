name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: NRadioRecorder-macOS.zip
          - os: windows-2025
            artifact: NRadioRecorder-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 9.0.x
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          brew install lame
          swift test --disable-sandbox
          ./scripts/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent "dist/NRadio 直播录音.app" "${{ matrix.artifact }}"
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project Tests/WindowsCoreTests/WindowsCoreTests.csproj -c Release
          dotnet publish Windows/NRadioRecorder.Windows/NRadioRecorder.Windows.csproj -c Release -r win-x64 --self-contained true -o publish/windows
          Compress-Archive -Path publish/windows/* -DestinationPath "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.zip
